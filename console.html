<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Sanctum Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column console — status strip, counts, then the update ledger (newest first), references, and an entry register. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eaeef2; --ink:#16212b; --mute:#5b6b78; --faint:#8a98a4; --line:#d9e0e6;
  --accent:#2f5f7f; --accent-soft:#e1ecf3; --ok:#1f7a4d; --ok-bg:#e1f3e9; --warn:#9a6200; --warn-bg:#fbf0d9; --bad:#a3322a; --bad-bg:#f8e3e1;
  --new:#6a3d9a; --new-bg:#efe6f7;
  --sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#171e24; --sunk:#1d262d; --ink:#e3e9ee; --mute:#9aa9b5; --faint:#6f7e8a; --line:#2a353e;
  --accent:#7fb3d6; --accent-soft:#1d3342; --ok:#6fcf9d; --ok-bg:#163326; --warn:#e2b155; --warn-bg:#3a2d12; --bad:#ec8b82; --bad-bg:#3c1d1a;
  --new:#c3a1e8; --new-bg:#2c2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#171e24; --sunk:#1d262d; --ink:#e3e9ee; --mute:#9aa9b5; --faint:#6f7e8a; --line:#2a353e;
  --accent:#7fb3d6; --accent-soft:#1d3342; --ok:#6fcf9d; --ok-bg:#163326; --warn:#e2b155; --warn-bg:#3a2d12; --bad:#ec8b82; --bad-bg:#3c1d1a;
  --new:#c3a1e8; --new-bg:#2c2140; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:26px}
.wrap>*,.ev,details,.book{min-width:0}
.pill{white-space:normal}
a{color:var(--accent)} a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;margin:0 0 10px;font-weight:650;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 .n{font-weight:500;color:var(--faint);font-size:14px}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--mute)} .small{font-size:13px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
header.top .sub{color:var(--mute);font-size:14px;margin-top:2px}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:550;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:12px 14px;min-width:0}
.tile b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12.5px;color:var(--mute)}
.ledger{display:grid;gap:12px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.ev.latest{border-color:var(--accent)}
.evhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.evhead time{font-family:var(--mono);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.evhead b{font-size:16px;font-weight:650}
.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.tag.new{background:var(--new-bg);color:var(--new)} .tag.upd{background:var(--sunk);color:var(--mute)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.scope{margin:6px 0 4px;font-size:14px;color:var(--ink)}
.src{font-size:13px;color:var(--mute)}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--mute)}
.counts strong{color:var(--ink);font-variant-numeric:tabular-nums}
details{margin-top:10px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);list-style-position:outside}
.tbl{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--mute);background:var(--sunk);letter-spacing:.03em;text-transform:uppercase;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td .th{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.flds{display:flex;flex-wrap:wrap;gap:4px}
.fld{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--mute);white-space:nowrap}
.refs{margin:0;padding-left:16px} .refs li{margin:1px 0}
.books{display:grid;gap:8px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.book .bh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between}
.book .bh b{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.filters input,.filters select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.filters input{flex:1 1 220px}
.foot{font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style></head><body>

ody/pnimdem.html#mfcidp"}]}, {"id": "d-neuropathy-related-to-arsenic", "type": "dx", "name": "Neuropathy related to arsenic", "th": "ปลายประสาทเสื่อมจากพิษสารหนู — ชาปวดแสบปลายเท้า อ่อนแรง อาจคล้าย GBS ร่วมกับผิวหนังและเล็บผิดปกติ", "src": "nea", "round": "r4", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Arsenic (inorganic)", "url": "https://neuromuscular.wustl.edu/nother/toxic.htm#arsenic"}]}, {"id": "d-normal-pressure-hydrocephalus-nph", "type": "dx", "name": "Normal pressure hydrocephalus (NPH)", "th": "โพรงน้ำในสมองขยายในผู้สูงอายุ — เดินลำบากแบบเท้าติดพื้น ความจำแย่ กลั้นปัสสาวะไม่อยู่", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-oculopharyngeal-muscular-dystrophy", "type": "dx", "name": "Oculopharyngeal muscular dystrophy", "th": "กล้ามเนื้อเสื่อมชนิดหนังตาตกและกลืนลำบากในผู้ใหญ่อายุมาก ยีนเด่น (PABPN1)", "src": "nea", "round": "r3", "added": "2026-10-07", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "khadilkar2024", "where": "Chapter 20 OPMD, pp. 269–276"}, {"book": "washu", "where": "Oculopharyngeal muscular dystrophy", "url": "https://neuromuscular.wustl.edu/musdist/peeom.html#opd"}]}, {"id": "d-opsoclonus-myoclonus-syndrome-oms", "type": "dx", "name": "Opsoclonus myoclonus syndrome (OMS)", "th": "ตากระตุกไวทุกทิศทางอย่างไม่เป็นจังหวะ ร่วมกับกล้ามเนื้อกระตุกและเดินเซ — ในเด็กเล็กต้องหา neuroblastoma ในผู้ใหญ่เกิดหลังติดเชื้อหรือร่วมกับมะเร็ง", "src": "nea", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "dalmau2022", "where": "Chapter 13 Autoimmune brainstem encephalitis"}, {"book": "fahn2022", "where": "Chapter 23 Autoimmune movement disorders"}]}, {"id": "d-organophosphate-poisoning", "type": "dx", "name": "Organophosphate poisoning", "th": "พิษยา 2019", "where": "Spinocerebellar ataxia: an update (review)", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6373366/"}]}, {"id": "d-statin-myopathy", "type": "dx", "name": "Statin myopathy", "th": "ปวดหรืออ่อนแรงกล้ามเนื้อจากยาลดไขมันกลุ่ม statin — ส่วนใหญ่ดีขึ้นเมื่อหยุดยา ถ้าไม่ดีขึ้นให้นึกถึง anti-HMGCR myopathy", "src": "nea", "round": "r4", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Lipid-lowering agents (statins)", "url": "https://neuromuscular.wustl.edu/msys/myoglob.html#lipid"}]}, {"id": "d-status-epilepticus", "type": "dx", "name": "Status epilepticus", "th": "ชักต่อเนื่องเกิน 5 นาทีหรือชักซ้ำโดยไม่ฟื้น — ภาวะฉุกเฉิน ต้องให้ยาตามลำดับเวลา", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-steroid-myopathy", "type": "dx", "name": "Steroid myopathy", "th": "กล้ามเนื้อต้นแขนต้นขาอ่อนแรงจากการใช้ steroid นาน ๆ — CK ปกติ", "src": "nea", "round": "r4", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Corticosteroid (glucocorticoid) myopathy", "url": "https://neuromuscular.wustl.edu/msys/mend.htm#csmyop"}]}, {"id": "d-stiff-person-syndrome-sps", "type": "dx", "name": "Stiff-person syndrome (SPS)", "th": "กล้ามเนื้อลำตัวแข็งเกร็งและกระตุกเป็นพักจากภูมิคุ้มกัน (anti-GAD) — ตกใจหรือเสียงดังกระตุ้น หลังแอ่น", "src": "nea", "round": "r3", "added": "2026-10-07", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "khadilkar2024", "where": "Chapter 33 Stiff person syndrome, pp. 505–511"}, {"book": "washu", "where": "Stiff-person syndrome", "url": "https://neuromuscular.wustl.edu/mother/activity.html#stiffman"}]}, {"id": "d-subacute-combined-degeneration", "type": "dx", "name": "Subacute combined degeneration", "th": "ขาดวิตามินบี 12 ทำให้ไขสันหลังส่วนหลังและข้างเสื่อม — ชาเท้า ทรงตัวไม่ได้ในที่มืด ขาเกร็ง", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Vitamin B12 deficiency", "url": "https://neuromuscular.wustl.edu/nother/vitamin.htm#B12"}]}, {"id": "d-subarachnoid-haemorrhage", "type": "dx", "name": "Subarachnoid haemorrhage", "th": "เลือดออกใต้เยื่อหุ้มสมอง — ปวดศีรษะรุนแรงที่สุดในชีวิตแบบทันที มักเกิดจากหลอดเลือดโป่งพองแตก", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-sydenhams-chorea", "type": "dx", "name": "Sydenham’s chorea", "th": "chorea ในเด็กหลังติดเชื้อ streptococcus กลุ่ม A เป็นส่วนหนึ่งของไข้รูมาติก มักมีอารมณ์แปรปรวน ต้องให้ penicillin ป้องกันระยะยาว", "src": "nea", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "burn2013", "where": "Chapter 22 Non-degenerative Choreas"}, {"book": "singer2010", "where": "Chapter 9 Chorea, Athetosis, and Ballism"}]}, {"id": "d-tardive-dyskinesia-td", "type": "dx", "name": "Tardive dyskinesia (TD)", "th": "การเคลื่อนไหวผิดปกติของปาก ลิ้น ขากรรไกรแบบซ้ำ ๆ หลังใช้ยาต้านโดปามีนนาน ๆ อาจเป็นถาวร", "src": "nea", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "fahn2022", "where": "Chapter 17 The tardive syndromes: Phenomenology, concepts on pathophysiology and treatment, and other neuroleptic-induced syndromes"}, {"book": "burn2013", "where": "Chapter 28 Drug-induced Movement Disorders"}]}, {"id": "d-temporal-lobe-epilepsy", "type": "dx", "name": "Temporal lobe epilepsy", "th": "ลมชักจากสมองกลีบขมับ — มีลางบอกเหตุแบบรู้สึกคุ้นเคยหรือจุกท้อง แล้วเหม่อ ทำปากขมุบขมิบ", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-tourettes-syndrome", "type": "dx", "name": "Tourette’s syndrome", "th": "tic ทั้งการเคลื่อนไหวและเสียงหลายแบบ เริ่มก่อนอายุ 18 ปี เป็นนานกว่า 1 ปี มักมี ADHD หรือ OCD ร่วม และดีขึ้นเมื่อโตเป็นผู้ใหญ่", "src": "nea", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "fahn2022", "where": "Chapter 15 Tics and Tourette syndrome"}, {"book": "singer2010", "where": "Chapter 6 Tics and Tourette Syndrome"}]}, {"id": "d-transverse-myelitis", "type": "dx", "name": "Transverse myelitis", "th": "ไขสันหลังอักเสบเฉียบพลัน — ขาอ่อนแรงสองข้าง ชาถึงระดับหนึ่ง ปัสสาวะไม่ออก ภายในวัน–สัปดาห์", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-trigeminal-neuralgia", "type": "dx", "name": "Trigeminal neuralgia", "th": "ปวดใบหน้าแบบไฟช็อตเป็นวินาที — กระตุ้นโดยแปรงฟัน เคี้ยว ลมพัด ตอบสนองดีต่อ carbamazepine", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-tuberculous-meningitis-tbm", "type": "dx", "name": "Tuberculous meningitis (TBM)", "th": "เยื่อหุ้มสมองอักเสบจากวัณโรค — ปวดศีรษะไข้เป็นสัปดาห์ เส้นประสาทสมองอ่อนแรง โพรงน้ำในสมองโต", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-ulnar-neuropathies", "type": "dx", "name": "Ulnar neuropathies", "th": "เส้นประสาท ulnar ถูกกด (มักที่ข้อศอก) — ชานิ้วก้อยและนิ้วนางครึ่งนิ้ว กล้ามเนื้อมือลีบ Froment sign", "src": "nea", "round": "r3", "added": "2026-10-07", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "khadilkar2024", "where": "Chapter 35 Individual mononeuropathies, pp. 533–554"}, {"book": "washu", "where": "Ulnar nerve lesions", "url": "https://neuromuscular.wustl.edu/nanatomy/ulnar.htm#lesions"}]}, {"id": "d-vascular-cognitive-impairment-and-dementia", "type": "dx", "name": "Vascular cognitive impairment and dementia", "th": "ความจำและการคิดเสื่อมจากโรคหลอดเลือดสมอง — ช้า วางแผนไม่ได้ เดินซอย มักมีปัจจัยเสี่ยงหลอดเลือด", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "vci2025", "where": "Slides: classification of VCI, post-stroke cognitive impairment and strategic infarcts, small vessel disease, management"}]}, {"id": "d-vasculitic-neuropathies", "type": "dx", "name": "Vasculitic neuropathies", "th": "เส้นประสาทเสียจากหลอดเลือดอักเสบ — ปวดมาก เส้นประสาทเสียทีละเส้น (mononeuritis multiplex)", "src": "nea", "round": "r3", "added": "2026-10-07", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "khadilkar2024", "where": "Chapter 36 Mononeuritis multiplex: vasculitic neuropathies, pp. 555–576"}, {"book": "immuno2565", "where": "บทที่ 4 Vasculitic neuropathy หน้า 53–68 (เกณฑ์ ตารางที่ 4.2 หน้า 56; การรักษา ตารางที่ 4.4 หน้า 61)"}, {"book": "washu", "where": "Vasculitic neuropathies", "url": "https://neuromuscular.wustl.edu/antibody/pnimax.html#vasculitis"}]}, {"id": "d-vestibular-neuritis", "type": "dx", "name": "Vestibular neuritis", "th": "เส้นประสาทการทรงตัวอักเสบ — เวียนหัวบ้านหมุนต่อเนื่องหลายวัน คลื่นไส้ ได้ยินปกติ", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-wernickes-encephalopathy", "type": "dx", "name": "Wernicke’s encephalopathy", "th": "ขาดวิตามินบี 1 — สับสน กลอกตาผิดปกติ เดินเซ พบในผู้ดื่มสุรา อาเจียนมาก หรือขาดอาหาร ให้ thiamine ก่อนกลูโคส", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Thiamine (B1) deficiency", "url": "https://neuromuscular.wustl.edu/nother/vitamin.htm#b1"}]}, {"id": "d-west-syndrome", "type": "dx", "name": "West syndrome", "th": "ทารกอายุราว 3–12 เดือนผงกตัวเกร็งเป็นชุด ๆ ตอนตื่นนอน พัฒนาการถดถอย EEG เป็น hypsarrhythmia — ต้องรักษาด่วนด้วย steroid/ACTH หรือ vigabatrin", "src": "nea", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "pellock2017", "where": "Chapter 30 West Syndrome"}]}, {"id": "d-wilsons-disease", "type": "dx", "name": "Wilson’s disease", "th": "ทองแดงสะสมในตับและสมอง — วัยรุ่นหรือผู้ใหญ่ตอนต้นที่มีอาการสั่น พูดไม่ชัด หรือมีโรคตับ รักษาได้", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-anti-nmda-receptor-encephalitis", "type": "dx", "name": "Anti-NMDA receptor encephalitis", "th": "สมองอักเสบจากภูมิต้านทานต่อตัวรับ NMDA — เริ่มด้วยพฤติกรรมแปลก ประสาทหลอน แล้วชัก ปากขยับเอง ซึมลง พบร่วมกับเนื้องอกรังไข่", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-spinal-cord-compression", "type": "dx", "name": "Spinal cord compression", "th": "ไขสันหลังถูกกดทับ — ปวดหลัง ขาอ่อนแรง ชาจากระดับหนึ่งลงไป ปัสสาวะผิดปกติ เป็นภาวะฉุกเฉิน", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-migraine-with-aura", "type": "dx", "name": "Migraine with aura", "th": "ไมเกรนที่มีอาการนำ — เห็นแสงหยัก ๆ หรือชาลามช้า ๆ 5–60 นาที แล้วตามด้วยปวดศีรษะ", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-hypoglycaemia", "type": "dx", "name": "Hypoglycaemia", "th": "น้ำตาลในเลือดต่ำ — สับสน ชัก หมดสติ หรืออ่อนแรงครึ่งซีกคล้าย stroke แก้ด้วยกลูโคส", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-pituitary-apoplexy", "type": "dx", "name": "Pituitary apoplexy", "th": "เลือดออกในเนื้องอกต่อมใต้สมองเฉียบพลัน — ปวดศีรษะรุนแรง ตามัว เห็นภาพซ้อน ขาดฮอร์โมนเฉียบพลัน", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-paroxysmal-hemicrania", "type": "dx", "name": "Paroxysmal hemicrania", "th": "ปวดรอบตาข้างเดียวเป็นช่วงสั้น ๆ หลายครั้งต่อวัน ร่วมกับน้ำตาน้ำมูกไหล หายได้ด้วย indomethacin", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-syncope", "type": "dx", "name": "Syncope", "th": "เป็นลมหมดสติชั่วคราวจากเลือดไปเลี้ยงสมองไม่พอ ฟื้นเร็วและสมบูรณ์", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-leptomeningeal-metastases", "type": "dx", "name": "Leptomeningeal metastases", "th": "มะเร็งกระจายไปที่เยื่อหุ้มสมองและน้ำไขสันหลัง — เส้นประสาทสมองและรากประสาทเสียหลายตำแหน่ง", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-tabes-dorsalis", "type": "dx", "name": "Tabes dorsalis", "th": "ซิฟิลิสระยะท้ายทำลายรากประสาทรับความรู้สึกและ dorsal column — ปวดแปลบ เดินเซในที่มืด รูม่านตาผิดปกติ", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Syphilis: tabes dorsalis", "url": "https://neuromuscular.wustl.edu/nother/infect.htm#syphilis"}]}, {"id": "d-botulism", "type": "dx", "name": "Botulism", "th": "พิษโบทูลินัม — อัมพาตไล่จากศีรษะลงล่าง หนังตาตก เห็นภาพซ้อน รูม่านตาขยาย มักเกิดจากอาหารหมักดอง/หน่อไม้ปี๊บ", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "khadilkar2024", "where": "Chapter 28 Myasthenia gravis (differential diagnosis), pp. 403–432"}, {"book": "washu", "where": "Botulism", "url": "https://neuromuscular.wustl.edu/nother/bot.htm"}]}, {"id": "d-thyroid-eye-disease", "type": "dx", "name": "Thyroid eye disease", "th": "โรคตาจากไทรอยด์ — ตาโปน หนังตาดึงรั้ง เห็นภาพซ้อนจากกล้ามเนื้อตาบวมแข็ง", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Dysthyroid ophthalmopathy", "url": "https://neuromuscular.wustl.edu/msys/mend.htm#dystophth"}]}, {"id": "d-tetanus", "type": "dx", "name": "Tetanus", "th": "บาดทะยัก — ขากรรไกรแข็ง (trismus) หน้ายิ้มเกร็ง หลังแอ่น เกร็งกระตุกเมื่อถูกกระตุ้น รู้สึกตัวดี", "src": "sanctum", "round": "r3", "added": "2026-10-07", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Tetanus", "url": "https://neuromuscular.wustl.edu/mother/activity.html#tetanus"}]}, {"id": "d-anti-neurofascin-155-nodopathy", "type": "dx", "name": "Anti-neurofascin-155 nodopathy", "th": "nodopathy จากแอนติบอดี NF155 — คนอายุน้อย อ่อนแรงปลายแขนขา เดินเซ มือสั่น โปรตีนในน้ำไขสันหลังสูงมาก IVIG ไม่ค่อยได้ผล", "src": "sanctum", "round": "r2", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "aian2022", "where": "Anti-NF155 antibodies, p. 1005 · Table 1, p. 1004"}, {"book": "washu", "where": "Neurofascin-155 IgG4 neuropathy", "url": "https://neuromuscular.wustl.edu/antibody/pnimdem.html#nfabclin"}]}, {"id": "d-anti-contactin-1-nodopathy", "type": "dx", "name": "Anti-contactin-1 nodopathy", "th": "nodopathy จากแอนติบอดี contactin-1 — ผู้สูงอายุ แย่ลงเร็ว แอกซอนเสียเร็ว อาจมีโปรตีนรั่วในปัสสาวะ (nephrotic) IVIG ไม่ได้ผล", "src": "sanctum", "round": "r2", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "aian2022", "where": "Anti-CNTN1 antibodies, p. 1005 · Table 1, p. 1004"}, {"book": "washu", "where": "Contactin-1 antibody neuropathy", "url": "https://neuromuscular.wustl.edu/antibody/pnimdem.html#cntn1"}]}, {"id": "d-pan-neurofascin-nodopathy", "type": "dx", "name": "Pan-neurofascin nodopathy", "th": "nodopathy จากแอนติบอดีต่อ neurofascin ทั้งสองชนิด — อาการเหมือน GBS รุนแรงมาก อัมพาตทั้งตัว หายใจไม่ได้ อาจสัมพันธ์มะเร็งเม็ดเลือด", "src": "sanctum", "round": "r2", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "aian2022", "where": "Pan-NF antibodies, pp. 1005–1006 · Table 1, p. 1004"}, {"book": "washu", "where": "Neurofascin-140/186 antibody polyneuropathy", "url": "https://neuromuscular.wustl.edu/antibody/pnimdem.html#nf140pn"}]}, {"id": "d-combined-central-and-peripheral-demyelination-ccpd", "type": "dx", "name": "Combined central and peripheral demyelination (CCPD)", "th": "ปลอกประสาทเสียทั้งในสมอง/ไขสันหลังและเส้นประสาทส่วนปลายพร้อมกัน — บางรายพบแอนติบอดี NF155", "src": "sanctum", "round": "r2", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "aian2022", "where": "Table 1 (NF155: CIDP, CCPD), p. 1004"}, {"book": "washu", "where": "CIDP with CNS demyelination (CCPD)", "url": "https://neuromuscular.wustl.edu/antibody/pnimdem.html#cidpcns"}]}, {"id": "d-anti-mag-neuropathy", "type": "dx", "name": "Anti-MAG neuropathy", "th": "เส้นประสาทเสื่อมจาก IgM ต่อ MAG — ชาปลายเท้า เดินเซ มือสั่น อ่อนแรงน้อย ดำเนินโรคช้ามาก", "src": "sanctum", "round": "r2", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "ppn2016", "where": "Paraproteinaemic disorders — anti-MAG; treatment section (rituximab)"}, {"book": "khadilkar2024", "where": "Chapter 52 DADS neuropathy, pp. 805–810; Chapter 53 Paraproteinemic neuropathies, pp. 811–826"}, {"book": "washu", "where": "MAG-associated neuropathy", "url": "https://neuromuscular.wustl.edu/antibody/pnimdem.html#mag"}]}, {"id": "d-canomad- ": "รากประสาทรับความรู้สึกอักเสบจากภูมิคุ้มกัน — เดินเซ ชา รีเฟล็กซ์หาย แต่ตรวจคลื่นไฟฟ้าเส้นประสาทปกติ", "src": "sanctum", "round": "r3", "added": "2026-10-07", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "khadilkar2024", "where": "Chapter 39 Chronic immune polyradiculopathies, pp. 599–607"}, {"book": "washu", "where": "Sensory demyelinating polyradiculopathy (CISP)", "url": "https://neuromuscular.wustl.edu/antibody/pnimdem.html#sensdemradic"}]}, {"id": "d-x-linked-charcot-marie-tooth-disease-cmtx1", "type": "dx", "name": "X-linked Charcot–Marie–Tooth disease (CMTX1)", "th": "CMT ชนิดถ่ายทอดทางโครโมโซม X (ยีน GJB1) — ผู้ชายอาการหนักกว่า อาจมีอาการคล้าย stroke ชั่วคราว", "src": "sanctum", "round": "r3", "added": "2026-10-07", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "khadilkar2024", "where": "Chapter 47 X-linked CMT, pp. 733–740"}, {"book": "washu", "where": "CMTX1 (GJB1)", "url": "https://neuromuscular.wustl.edu/time/hmsn.html#x1"}]}, {"id": "d-anti-lgi1-encephalitis", "type": "dx", "name": "Anti-LGI1 encephalitis", "th": "สมองส่วน limbic อักเสบจากแอนติบอดีต่อ LGI1 ในผู้สูงอายุ — ความจำเสื่อมเร็ว ชักแบบเกร็งหน้าและแขนสั้น ๆ (FBDS) และโซเดียมต่ำ", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "dalmau2022", "where": "Chapter 7 Autoimmunity against VGKC-associated proteins (LGI1/CASPR2)"}, {"book": "dalmau2022", "where": "Chapter 6 Limbic encephalitis"}]}, {"id": "d-anti-gaba-b-receptor-encephalitis", "type": "dx", "name": "Anti-GABA-B receptor encephalitis", "th": "สมองอักเสบจากแอนติบอดีต่อตัวรับ GABA-B — ชักรุนแรงหรือ status epilepticus ความจำเสีย มักพบร่วมกับมะเร็งปอดชนิด small-cell", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "dalmau2022", "where": "Chapter 6 Limbic encephalitis"}]}, {"id": "d-autoimmune-gfap-astrocytopathy", "type": "dx", "name": "Autoimmune GFAP astrocytopathy", "th": "เยื่อหุ้มสมอง สมอง และไขสันหลังอักเสบจากภูมิต้านทาน พบแอนติบอดีต่อ GFAP ใน CSF — คล้ายติดเชื้อ แต่ MRI มีเส้น enhance แนวรัศมีรอบหลอดเลือดและตอบสนองดีต่อ steroid", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "dalmau2022", "where": "Chapter 11 NMOSD and GFAP autoimmunity"}]}, {"id": "d-anti-iglon5-disease", "type": "dx", "name": "Anti-IgLON5 disease", "th": "โรคจากแอนติบอดีต่อ IgLON5 ที่มีทั้งภูมิต้านทานและการเสื่อมแบบ tauopathy — ละเมอผิดปกติ หายใจผิดปกติตอนหลับ กลืนลำบาก เดินเซ และการเคลื่อนไหวผิดปกติ", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "dalmau2022", "where": "Chapter 15 Anti-IgLON5 disease"}]}, {"id": "d-immune-checkpoint-inhibitor-related-encephalitis", "type": "dx", "name": "Immune checkpoint inhibitor-related encephalitis", "th": "สมองอักเสบเป็นผลข้างเคียงของยา immune checkpoint inhibitor (เช่น anti-PD-1) — สับสน ชัก เดินเซ หรือเยื่อหุ้มสมองอักเสบ ระหว่างรักษามะเร็ง", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "dalmau2022", "where": "Chapter 16 Complications of cancer (incl. checkpoint inhibitors)"}]}, {"id": "d-childhood-absence-epilepsy-cae", "type": "dx", "name": "Childhood absence epilepsy (CAE)", "th": "เด็กวัยเรียนเหม่อลอยหยุดนิ่งไม่กี่วินาทีวันละหลายสิบครั้ง หายใจเร็วกระตุ้นได้ EEG เป็น spike-wave 3 Hz — ยาแรกคือ ethosuximide", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "pellock2017", "where": "Chapter 19 Childhood Absence Epilepsy"}]}, {"id": "d-self-limited-epilepsy-with-centrotemporal-spikes-selects", "type": "dx", "name": "Self-limited epilepsy with centrotemporal spikes (SeLECTS)", "th": "เด็กอายุ 4–10 ปีชักกระตุกมุมปากหน้าข้างเดียว น้ำลายไหล พูดไม่ได้ แต่รู้ตัว มักเกิดตอนหลับ EEG เป็น centrotemporal spikes หายเองเมื่อโต", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "pellock2017", "where": "Chapter 23 Childhood–Rolandic Epilepsy"}]}, {"id": "d-self-limited-epilepsy-with-autonomic-seizures-panayiotopoulo", "type": "dx", "name": "Self-limited epilepsy with autonomic seizures (Panayiotopoulos syndrome)", "th": "เด็กเล็ก 3–6 ปีชักแบบอาเจียน ซีด ตาเหลือก ซึม นานเป็นสิบนาทีจนดูเหมือนติดเชื้อสมอง แต่ชักน้อยครั้งและหายเอง", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "pellock2017", "where": "Chapter 22 Panayiotopoulos Syndrome"}]}, {"id": "d-febrile-seizures", "type": "dx", "name": "Febrile seizures", "th": "เด็ก 6 เดือน–5 ปีชักขณะมีไข้โดยไม่มีการติดเชื้อในสมอง แบ่งเป็น simple และ complex — ส่วนใหญ่ไม่อันตราย แต่ต้องคิดถึง meningitis ก่อนเสมอ", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "pellock2017", "where": "Chapter 35 Febrile Seizures"}]}, {"id": "d-self-limited-familial-neonatal-epilepsy-selfne", "type": "dx", "name": "Self-limited familial neonatal epilepsy (SeLFNE)", "th": "ทารกครบกำหนดแข็งแรงดีชักเกร็งสั้น ๆ ตั้งแต่วันที่ 2–7 หลังคลอด มีประวัติครอบครัวคล้ายกัน ยีน KCNQ2 — หายเองในไม่กี่เดือน", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "pellock2017", "where": "Chapter 15 Age-Related Syndromes: Familial Benign Seizures Starting in Neonates and Infants"}, {"book": "pellock2017", "where": "Chapter 34 Neonatal Seizures"}]}, {"id": "d-early-onset-generalized-tor1a-dystonia-dyt1", "type": "dx", "name": "Early-onset generalized TOR1A dystonia (DYT1)", "th": "dystonia ทางพันธุกรรมจากยีน TOR1A เริ่มที่แขนหรือขาในวัยเด็กแล้วลามทั้งตัว สติปัญญาปกติ ตอบสนองดีต่อ DBS ที่ GPi", "src": "sanctum", "round": "r5", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "burn2013", "where": "Chapter 18 Primary Dystonia"}, {"book": "fahn2022", "where": "Chapter 11 Dystonia: Phenomenology, classification, etiology, pathology, biochemistry, and genetics"}]}, {"id": "d-adcy5-related-dyskinesia-adcy5-rd", "type": "dx", "name": "ADCY5-related dyskinesia (ADCY5-RD)", "th": "การเคลื่อนไหวผิดปกติทางพันธุกรรมจากยีน ADCY5 (gain-of-function) — chorea/dystonia/myoclonus ในเด็ก กำเริบเป็นชุดช่วงหลับ–ตื่น รู้สติดี EEG และ MRI ปกติ ตอบสนองต่อ caffeine", "src": "sanctum", "round": "r6", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "usernotes", "where": "ADCY5-Related Dyskinesia (ADCY5-RD) — curator's note, 8 Oct 2026"}]}, {"id": "d-transient-ischaemic-attack-tia", "type": "dx", "name": "Transient ischaemic attack (TIA)", "th": "สมองขาดเลือดชั่วคราว — อาการเหมือนอัมพาตแต่หายเองภายในไม่นาน เป็นสัญญาณเตือนว่าอาจเกิด stroke จริงในไม่ช้า", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-cerebral-venous-thrombosis-cvt", "type": "dx", "name": "Cerebral venous thrombosis (CVT)", "th": "หลอดเลือดดำในสมองอุดตัน — ปวดศีรษะ ชัก หรือมีเลือดออกในสมอง พบบ่อยในหญิงอายุน้อย ระหว่างตั้งครรภ์หรือกินยาคุม", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-cervical-artery-dissection", "type": "dx", "name": "Cervical artery dissection", "th": "ผนังหลอดเลือดแดงที่คอฉีกขาด — ปวดคอ/ศีรษะข้างเดียว อาจมี Horner และ stroke ในคนอายุน้อย", "src": "sanctum", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": []}, {"id": "d-chemotherapy-induced-peripheral-neuropathy", "type": "dx", "name": "Chemotherapy-induced peripheral neuropathy", "th": "ปลายประสาทอักเสบจากยาเคมีบำบัด — ชา เจ็บแปลบ ปลายมือปลายเท้า ขึ้นกับขนาดยาสะสม", "src": "sanctum", "round": "r4", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Chemotherapy-induced polyneuropathy (CIPN)", "url": "https://neuromuscular.wustl.edu/nother/toxic.htm#cipn"}]}, {"id": "d-pyridoxine-vitamin-b6-toxicity-neuropathy", "type": "dx", "name": "Pyridoxine (vitamin B6) toxicity neuropathy", "th": "ปลายประสาทรับความรู้สึกเสียจากกินวิตามินบี 6 ขนาดสูงนาน ๆ — ชาและเดินเซ หยุดวิตามินแล้วมักดีขึ้น", "src": "sanctum", "round": "r4", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "Pyridoxine intoxication", "url": "https://neuromuscular.wustl.edu/nother/vitamin.htm#pyridoxineintox"}]}, {"id": "d-hiv-associated-distal-sensory-polyneuropathy", "type": "dx", "name": "HIV-associated distal sensory polyneuropathy", "th": "ปลายประสาทรับความรู้สึกเสียในผู้ติดเชื้อ HIV — ปวดแสบชาที่เท้าทั้งสองข้าง พบบ่อยที่สุดในกลุ่มโรคประสาทจาก HIV", "src": "sanctum", "round": "r4", "added": "2026-10-08", "updated": "2026-10-08", "status": "draft", "det": true, "case": true, "refs": [{"book": "washu", "where": "HIV: distal sensory-motor polyneuropathy", "url": "https://neuromuscular.wustl.edu/nother/infect.htm#smpnhiv"}]}, {"id": "s_froment_s_sign", "type": "sign", "name": "Froment’s Sign", "th": "หนีบกระดาษระหว่างนิ้วโป้งกับนิ้วชี้แล้วนิ้วโป้งงอ — กล้ามเนื้อ adductor pollicis อ่อนแรง (เส้นประสาท ulnar)", "src": "nea", "round": "r1", "added": "2026-10-04", "updated": "2026-10-08", "status": "draft", "det": true, "case": false, "refs": []}, {"id": "s_gowers_manoeuvre_gowers_sign", "type": "sign", "name": "Gowers’ Manoeuvre,
