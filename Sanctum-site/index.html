<script>(function(){var el=document.getElementById('lx');if(!el)return;var lv=document.getElementById('lxlvl'),pc=document.getElementById('lxpct'),real=0,tr=0,shown=-1,dead=false;
function draw(){var p=Math.max(real,tr);if(p===shown)return;shown=p;lv.style.transform='translateY('+(148-p*138).toFixed(1)+'px)';var n=Math.round(p*100);pc.textContent=n+'%';el.setAttribute('aria-valuenow',n);}
var t=setInterval(function(){tr+=(0.88-tr)*0.03;draw();},120);
window.__lx={set:function(f){if(!dead&&f>real){real=Math.min(1,f);draw();}},
done:function(){if(dead)return;dead=true;clearInterval(t);real=1;draw();var m=el.querySelector('#lxmsg');if(m)m.textContent='Ready!';document.body.appendChild(el);el.style.pointerEvents='none';el.classList.add('lx--fin');
setTimeout(function(){el.classList.add('lx--out');setTimeout(function(){el.remove();},320);},220);},
fail:function(){dead=true;clearInterval(t);el.remove();}};draw();})();</script>
